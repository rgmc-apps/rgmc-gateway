<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set Up Password — RGMC Gateway</title>
  <link rel="icon" type="image/png" href="/static/badge.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>document.documentElement.setAttribute('data-theme',localStorage.getItem('rgmc-theme')||'light');</script>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <div class="gate-overlay" id="gate">
    <div class="gate-card">
      <div class="gate-card-inner">

        <div class="gate-logo-wrap">
          <img src="/static/logo.png" alt="RGMC" class="gate-logo-img">
        </div>

        <div class="gate-brand">
          <h1 class="gate-title">Set Up Password</h1>
          <p class="gate-tagline">Secure your RGMC Gateway account</p>
        </div>

        <p class="gate-desc" id="setupWelcome">Creating a password for your account.</p>

        <div class="form-group" style="margin-bottom:12px;">
          <label class="form-label">Username</label>
          <input class="form-input profile-readonly" type="text" id="setupUsername" readonly>
        </div>

        <div class="form-group" style="margin-bottom:8px;">
          <label class="form-label" for="setupPassword">New Password <span class="required">*</span></label>
          <div class="gate-pw-wrap">
            <input class="form-input" type="password" id="setupPassword" placeholder="Minimum 8 characters" autocomplete="new-password" oninput="updateStrength('setupPassword','setupStrength')">
            <button type="button" class="gate-pw-toggle" onclick="togglePwVisibility('setupPassword')" tabindex="-1" title="Show/hide">
              <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <div class="pw-strength-wrap" id="setupStrength" style="display:none;">
            <div class="pw-strength-bar"><div class="pw-strength-fill" id="setupStrengthFill"></div></div>
            <span class="pw-strength-label" id="setupStrengthLabel"></span>
          </div>
        </div>

        <div class="form-group" style="margin-bottom:6px;">
          <label class="form-label" for="setupConfirm">Confirm Password <span class="required">*</span></label>
          <div class="gate-pw-wrap">
            <input class="form-input" type="password" id="setupConfirm" placeholder="Re-enter your password" autocomplete="new-password" onkeydown="if(event.key==='Enter')submitSetup()">
            <button type="button" class="gate-pw-toggle" onclick="togglePwVisibility('setupConfirm')" tabindex="-1" title="Show/hide">
              <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <div style="margin-bottom:16px;">
          <button type="button" class="gate-gen-btn" onclick="generateAndFill('setupPassword','setupConfirm','setupStrength')">
            <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>
            Generate strong password
          </button>
        </div>

        <div id="setupError" class="ar-systems-error" style="display:none;margin-bottom:12px;"></div>
        <div id="setupSuccess" style="display:none;text-align:center;padding:14px;background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);border-radius:var(--radius);color:#16a34a;font-size:13.5px;font-weight:600;margin-bottom:12px;">
          Password set successfully! Redirecting to the portal…
        </div>

        <div id="setupActions">
          <button type="button" class="btn-gate-primary" onclick="submitSetup()" id="setupBtn">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            Set Password &amp; Sign In
          </button>
        </div>
        <div id="setupLoading" class="form-state" style="display:none;margin-top:12px;justify-content:center;">
          <div class="spinner"></div>
          <span>Setting up…</span>
        </div>

      </div>
    </div>
  </div>

  <script src="/static/theme.js"></script>
  <script>
  'use strict';

  /* ── Password utilities ── */
  function passwordStrength(pw) {
    if (!pw) return { score: 0, label: '', pct: 0, color: '' };
    let s = 0;
    if (pw.length >= 8)  s++;
    if (pw.length >= 12) s++;
    if (/[A-Z]/.test(pw)) s++;
    if (/[a-z]/.test(pw)) s++;
    if (/[0-9]/.test(pw)) s++;
    if (/[^A-Za-z0-9]/.test(pw)) s++;
    const levels = [
      { label: 'Very Weak', color: '#ef4444' },
      { label: 'Weak',      color: '#f97316' },
      { label: 'Fair',      color: '#eab308' },
      { label: 'Good',      color: '#84cc16' },
      { label: 'Strong',    color: '#22c55e' },
    ];
    const idx = Math.min(Math.max(Math.floor(s * 5 / 7), 0), 4);
    return { score: s, label: levels[idx].label, color: levels[idx].color, pct: Math.min(100, Math.round(s * 17)) };
  }

  function updateStrength(inputId, wrapId) {
    const val  = document.getElementById(inputId)?.value || '';
    const wrap = document.getElementById(wrapId);
    const fill = document.getElementById(wrapId + 'Fill');
    const lbl  = document.getElementById(wrapId + 'Label');
    if (!wrap || !fill || !lbl) return;
    if (!val) { wrap.style.display = 'none'; return; }
    const r = passwordStrength(val);
    wrap.style.display = '';
    fill.style.width   = r.pct + '%';
    fill.style.background = r.color;
    lbl.textContent = r.label;
    lbl.style.color = r.color;
  }

  function togglePwVisibility(id) {
    const el = document.getElementById(id);
    if (el) el.type = el.type === 'password' ? 'text' : 'password';
  }

  function generatePassword() {
    const upper   = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
    const lower   = 'abcdefghjkmnpqrstuvwxyz';
    const digits  = '23456789';
    const special = '!@#$%&*-_=+?';
    const all     = upper + lower + digits + special;
    const pw = [
      upper[Math.floor(Math.random() * upper.length)],
      lower[Math.floor(Math.random() * lower.length)],
      digits[Math.floor(Math.random() * digits.length)],
      special[Math.floor(Math.random() * special.length)],
    ];
    for (let i = 0; i < 12; i++) pw.push(all[Math.floor(Math.random() * all.length)]);
    for (let i = pw.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [pw[i], pw[j]] = [pw[j], pw[i]];
    }
    return pw.join('');
  }

  function generateAndFill(pwId, confirmId, strengthWrapId) {
    const pw = generatePassword();
    const pwEl      = document.getElementById(pwId);
    const confirmEl = document.getElementById(confirmId);
    if (pwEl)      { pwEl.value = pw;      pwEl.type = 'text'; }
    if (confirmEl) { confirmEl.value = pw; confirmEl.type = 'text'; }
    updateStrength(pwId, strengthWrapId);
  }

  /* ── Setup flow ── */
  const _setupUsername = sessionStorage.getItem('setup_username') || '';
  const _setupSession  = (() => { try { return JSON.parse(sessionStorage.getItem('setup_session')); } catch { return null; } })();

  document.addEventListener('DOMContentLoaded', () => {
    if (!_setupUsername) {
      location.href = '/';
      return;
    }
    document.getElementById('setupUsername').value = _setupUsername;
    const first = _setupSession?.firstName || _setupUsername;
    document.getElementById('setupWelcome').textContent = `Hi ${first}! Please create a password to secure your account.`;
  });

  async function submitSetup() {
    const pw      = (document.getElementById('setupPassword')?.value  || '').trim();
    const confirm = (document.getElementById('setupConfirm')?.value   || '').trim();
    const errEl   = document.getElementById('setupError');
    errEl.style.display = 'none';

    if (!pw)           { errEl.textContent = 'Please enter a password.';         errEl.style.display = ''; return; }
    if (pw.length < 8) { errEl.textContent = 'Password must be at least 8 characters.'; errEl.style.display = ''; return; }
    if (pw !== confirm) { errEl.textContent = 'Passwords do not match.';          errEl.style.display = ''; return; }

    document.getElementById('setupActions').style.display  = 'none';
    document.getElementById('setupLoading').style.display  = '';

    try {
      const res  = await fetch('/api/auth/setup-password', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ username: _setupUsername, password: pw, confirm_password: confirm }),
      });
      const data = await res.json();
      if (!res.ok || !data.success) throw new Error(data.error || 'Setup failed.');

      // Save session and redirect
      if (_setupSession) {
        sessionStorage.removeItem('setup_session');
        sessionStorage.removeItem('setup_username');
        localStorage.setItem('rgmc_gateway_session', JSON.stringify(_setupSession));
      }
      document.getElementById('setupLoading').style.display = 'none';
      document.getElementById('setupSuccess').style.display = '';
      setTimeout(() => { location.href = '/'; }, 1800);
    } catch (err) {
      document.getElementById('setupLoading').style.display  = 'none';
      document.getElementById('setupActions').style.display  = '';
      errEl.textContent    = err.message || 'Setup failed. Please try again.';
      errEl.style.display  = '';
    }
  }
  </script>
</body>
</html>
