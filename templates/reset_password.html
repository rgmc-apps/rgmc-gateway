<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — RGMC Gateway</title>
  <link rel="icon" type="image/png" href="/static/badge.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>document.documentElement.setAttribute('data-theme',localStorage.getItem('rgmc-theme')||'light');</script>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <div class="gate-overlay" id="gate">
    <div class="gate-card">
      <div class="gate-card-inner">

        <div class="gate-logo-wrap">
          <img src="/static/logo.png" alt="RGMC" class="gate-logo-img">
        </div>

        <div class="gate-brand">
          <h1 class="gate-title">Reset Password</h1>
          <p class="gate-tagline">Create a new RGMC Gateway password</p>
        </div>

        <!-- Invalid/expired token state -->
        <div id="resetInvalid" style="display:none;text-align:center;padding:8px 0;">
          <svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom:14px;"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          <p class="gate-desc">This reset link is invalid or has expired. Reset links are only valid for 1 hour.</p>
          <a href="/forgot-password" class="btn-gate-primary" style="margin-top:4px;text-decoration:none;">Request a new link</a>
        </div>

        <!-- Reset form -->
        <div id="resetForm">
          <p class="gate-desc" id="resetWelcome">Enter your new password below.</p>

          <div class="form-group" style="margin-bottom:8px;">
            <label class="form-label" for="resetPassword">New Password <span class="required">*</span></label>
            <div class="gate-pw-wrap">
              <input class="form-input" type="password" id="resetPassword" placeholder="Minimum 8 characters" autocomplete="new-password" oninput="updateStrength('resetPassword','resetStrength')">
              <button type="button" class="gate-pw-toggle" onclick="togglePwVisibility('resetPassword')" tabindex="-1" title="Show/hide">
                <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
            <div class="pw-strength-wrap" id="resetStrength" style="display:none;">
              <div class="pw-strength-bar"><div class="pw-strength-fill" id="resetStrengthFill"></div></div>
              <span class="pw-strength-label" id="resetStrengthLabel"></span>
            </div>
          </div>

          <div class="form-group" style="margin-bottom:6px;">
            <label class="form-label" for="resetConfirm">Confirm Password <span class="required">*</span></label>
            <div class="gate-pw-wrap">
              <input class="form-input" type="password" id="resetConfirm" placeholder="Re-enter your password" autocomplete="new-password" onkeydown="if(event.key==='Enter')submitReset()">
              <button type="button" class="gate-pw-toggle" onclick="togglePwVisibility('resetConfirm')" tabindex="-1" title="Show/hide">
                <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>

          <div style="margin-bottom:16px;">
            <button type="button" class="gate-gen-btn" onclick="generateAndFill('resetPassword','resetConfirm','resetStrength')">
              <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>
              Generate strong password
            </button>
          </div>

          <div id="resetError" class="ar-systems-error" style="display:none;margin-bottom:12px;"></div>

          <div id="resetActions">
            <button type="button" class="btn-gate-primary" onclick="submitReset()" id="resetBtn">
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              Set New Password
            </button>
          </div>
          <div id="resetLoading" class="form-state" style="display:none;margin-top:12px;justify-content:center;">
            <div class="spinner"></div>
            <span>Updating…</span>
          </div>
        </div>

        <!-- Success state -->
        <div id="resetSuccess" style="display:none;text-align:center;padding:8px 0;">
          <svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom:14px;"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
          <p class="gate-desc" style="margin-bottom:0;">Your password has been reset successfully. Redirecting to sign in…</p>
        </div>

      </div>
    </div>
  </div>

  <script src="/static/theme.js"></script>
  <script>
  'use strict';

  /* ── Password utilities ── */
  function passwordStrength(pw) {
    if (!pw) return { score: 0, label: '', pct: 0, color: '' };
    let s = 0;
    if (pw.length >= 8)  s++;
    if (pw.length >= 12) s++;
    if (/[A-Z]/.test(pw)) s++;
    if (/[a-z]/.test(pw)) s++;
    if (/[0-9]/.test(pw)) s++;
    if (/[^A-Za-z0-9]/.test(pw)) s++;
    const levels = [
      { label: 'Very Weak', color: '#ef4444' },
      { label: 'Weak',      color: '#f97316' },
      { label: 'Fair',      color: '#eab308' },
      { label: 'Good',      color: '#84cc16' },
      { label: 'Strong',    color: '#22c55e' },
    ];
    const idx = Math.min(Math.max(Math.floor(s * 5 / 7), 0), 4);
    return { score: s, label: levels[idx].label, color: levels[idx].color, pct: Math.min(100, Math.round(s * 17)) };
  }

  function updateStrength(inputId, wrapId) {
    const val  = document.getElementById(inputId)?.value || '';
    const wrap = document.getElementById(wrapId);
    const fill = document.getElementById(wrapId + 'Fill');
    const lbl  = document.getElementById(wrapId + 'Label');
    if (!wrap || !fill || !lbl) return;
    if (!val) { wrap.style.display = 'none'; return; }
    const r = passwordStrength(val);
    wrap.style.display = '';
    fill.style.width      = r.pct + '%';
    fill.style.background = r.color;
    lbl.textContent   = r.label;
    lbl.style.color   = r.color;
  }

  function togglePwVisibility(id) {
    const el = document.getElementById(id);
    if (el) el.type = el.type === 'password' ? 'text' : 'password';
  }

  function generatePassword() {
    const upper   = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
    const lower   = 'abcdefghjkmnpqrstuvwxyz';
    const digits  = '23456789';
    const special = '!@#$%&*-_=+?';
    const all     = upper + lower + digits + special;
    const pw = [
      upper[Math.floor(Math.random() * upper.length)],
      lower[Math.floor(Math.random() * lower.length)],
      digits[Math.floor(Math.random() * digits.length)],
      special[Math.floor(Math.random() * special.length)],
    ];
    for (let i = 0; i < 12; i++) pw.push(all[Math.floor(Math.random() * all.length)]);
    for (let i = pw.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [pw[i], pw[j]] = [pw[j], pw[i]];
    }
    return pw.join('');
  }

  function generateAndFill(pwId, confirmId, strengthWrapId) {
    const pw = generatePassword();
    const pwEl      = document.getElementById(pwId);
    const confirmEl = document.getElementById(confirmId);
    if (pwEl)      { pwEl.value = pw;      pwEl.type = 'text'; }
    if (confirmEl) { confirmEl.value = pw; confirmEl.type = 'text'; }
    updateStrength(pwId, strengthWrapId);
  }

  /* ── Reset flow ── */
  const _resetToken = new URLSearchParams(location.search).get('token') || '';

  document.addEventListener('DOMContentLoaded', () => {
    if (!_resetToken) {
      document.getElementById('resetForm').style.display    = 'none';
      document.getElementById('resetInvalid').style.display = '';
    }
  });

  async function submitReset() {
    const pw      = (document.getElementById('resetPassword')?.value  || '').trim();
    const confirm = (document.getElementById('resetConfirm')?.value   || '').trim();
    const errEl   = document.getElementById('resetError');
    errEl.style.display = 'none';

    if (!pw)            { errEl.textContent = 'Please enter a password.';               errEl.style.display = ''; return; }
    if (pw.length < 8)  { errEl.textContent = 'Password must be at least 8 characters.'; errEl.style.display = ''; return; }
    if (pw !== confirm) { errEl.textContent = 'Passwords do not match.';                errEl.style.display = ''; return; }

    document.getElementById('resetActions').style.display = 'none';
    document.getElementById('resetLoading').style.display = '';

    try {
      const res  = await fetch('/api/auth/reset-password', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ token: _resetToken, password: pw, confirm_password: confirm }),
      });
      const data = await res.json();
      if (!res.ok || !data.success) throw new Error(data.error || 'Reset failed.');

      document.getElementById('resetLoading').style.display  = 'none';
      document.getElementById('resetForm').style.display     = 'none';
      document.getElementById('resetSuccess').style.display  = '';
      setTimeout(() => { location.href = '/'; }, 2200);
    } catch (err) {
      document.getElementById('resetLoading').style.display  = 'none';
      document.getElementById('resetActions').style.display  = '';
      const msg = err.message || 'Reset failed.';
      if (msg.toLowerCase().includes('invalid') || msg.toLowerCase().includes('expired')) {
        document.getElementById('resetForm').style.display    = 'none';
        document.getElementById('resetInvalid').style.display = '';
      } else {
        errEl.textContent   = msg;
        errEl.style.display = '';
      }
    }
  }
  </script>
</body>
</html>
